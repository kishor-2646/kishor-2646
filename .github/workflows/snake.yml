name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate red-themed snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: kishor-2646
          outputs: |
            dist/github-snake-red.svg?color_snake=ff3b3b&color_dots=170a0a,3a1616,7f1d1d,b91c1c,ff3b3b

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
