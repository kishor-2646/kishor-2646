<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 195" width="420" height="195" role="img" aria-label="Kishor Kumar GitHub stats">
<title>GitHub Stats</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes ringDraw{from{stroke-dashoffset:270}to{stroke-dashoffset:68}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.row{opacity:0;animation:fadeIn .5s ease forwards;transform-box:fill-box}
.ring{stroke-dashoffset:270;animation:ringDraw 1.4s .4s cubic-bezier(.2,.8,.3,1) forwards}
.rank{opacity:0;animation:popIn .5s 1.6s cubic-bezier(.2,.8,.3,1.4) forwards;transform-box:fill-box;transform-origin:center}
@keyframes glintMove{0%{transform:translateX(-160px)}100%{transform:translateX(560px)}}
.glint{animation:glintMove 3.6s ease-in-out infinite}
]]></style>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff3b3b"/><stop offset="100%" stop-color="#ffb03b"/>
</linearGradient>
<linearGradient id="glintg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity=".45"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="cardClip"><rect x="1" y="1" width="418" height="193" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="418" height="193" rx="14" fill="#eaf6ff" stroke="#1e88c7" stroke-width="1" stroke-opacity=".5"/>
<text x="20" y="30" font-size="15" font-weight="700" fill="#ff6b35">Kishor's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(85,115)">
  <circle r="55" fill="none" stroke="#dbeefc" stroke-width="10"/>
  <circle class="ring" r="55" fill="none" stroke="url(#ringg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="270" transform="rotate(-90)"/>
  <text class="rank" y="-4" text-anchor="middle" font-size="22" font-weight="700" fill="#0e2233">B+</text>
  <text y="16" text-anchor="middle" font-size="10" fill="#5f7a8c" letter-spacing="1">RANK</text>
</g>

<!-- stat rows -->
<g font-size="14" fill="#0e2233">
  <g class="row" style="animation-delay:.2s"><circle cx="185" cy="52" r="3.5" fill="#ff3b3b"/><text x="196" y="57">Public Repos</text><text x="400" y="57" text-anchor="end" font-weight="700" fill="#ff6b35">23</text></g>
  <g class="row" style="animation-delay:.35s"><circle cx="185" cy="80" r="3.5" fill="#ff6b35"/><text x="196" y="85">Contributions (Yr)</text><text x="400" y="85" text-anchor="end" font-weight="700" fill="#ff6b35">340+</text></g>
  <g class="row" style="animation-delay:.5s"><circle cx="185" cy="108" r="3.5" fill="#ffb03b"/><text x="196" y="113">Followers</text><text x="400" y="113" text-anchor="end" font-weight="700" fill="#ff6b35">1</text></g>
  <g class="row" style="animation-delay:.65s"><circle cx="185" cy="136" r="3.5" fill="#b91c1c"/><text x="196" y="141">Pull Requests</text><text x="400" y="141" text-anchor="end" font-weight="700" fill="#ff6b35">12+</text></g>
  <g class="row" style="animation-delay:.8s"><circle cx="185" cy="164" r="3.5" fill="#ff3b3b"/><text x="196" y="169">Longest Streak</text><text x="400" y="169" text-anchor="end" font-weight="700" fill="#ff6b35">9 days</text></g>
</g>

<rect class="glint" x="1" y="1" width="70" height="193" fill="url(#glintg)" clip-path="url(#cardClip)" transform="skewX(-18)"/>
</svg>
