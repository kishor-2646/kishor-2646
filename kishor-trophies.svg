          y="10"
          width="120"
          height="150"
          rx="12"
          fill="#f4fbff"
          stroke="#1e88c7"
          stroke-width="1"
          stroke-opacity=".5"/>


    <!-- Icon -->
    <text class="badge"
          style="animation-delay:0s"
          x="70"
          y="55"
          text-anchor="middle"
          font-size="30">
      📦
    </text>


    <text x="70"
          y="90"
          text-anchor="middle"
          font-size="12"
          fill="#5f7a8c">
      Repositories
    </text>


    <text x="70"
          y="112"
          text-anchor="middle"
          font-size="20"
          font-weight="700"
          fill="#ff6b35">
      23
    </text>


    <text x="70"
          y="135"
          text-anchor="middle"
          font-size="10"
          fill="#ff3b3b">
      A
    </text>

  </g>


