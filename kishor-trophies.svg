<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 170"
     width="900"
     height="170"
     role="img"
     aria-label="Kishor Kumar trophies">

  <title>Trophies</title>

  <defs>

    <style type="text/css"><![CDATA[

      text{
        font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
      }

      /* =========================================================
         CARD ENTRANCE
         ========================================================= */

      @keyframes popIn{

        0%{
          opacity:0;
          transform:translateY(16px) scale(.75);
        }

        70%{
          opacity:1;
          transform:translateY(-3px) scale(1.05);
        }

        100%{
          opacity:1;
          transform:translateY(0) scale(1);
        }

      }


      /* =========================================================
         SEQUENTIAL HIGHLIGHT
         
         One card gets highlighted at a time.

         7 cards × 1.8s = 12.6s total cycle
         ========================================================= */

      @keyframes cardHighlight{

        0%{
          stroke:#1e88c7;
          stroke-opacity:.3;
          filter:none;
        }

        /* Start glowing */
        3%{
          stroke:#22d3ee;
          stroke-opacity:0.5;
          filter:
            drop-shadow(0 0 2px #22d3ee)
            drop-shadow(0 0 5px #22d3ee);
        }

        /* Strongest point */
        7%{
          stroke:#22d3ee;
          stroke-opacity:0.5;
          filter:
            drop-shadow(0 0 3px #22d3ee)
            drop-shadow(0 0 7px #22d3ee);
        }

        /* Fade back */
        12%{
          stroke:#1e88c7;
          stroke-opacity:.3;
          filter:none;
        }

        /* Stay normal until its next turn */
        100%{
          stroke:#1e88c7;
          stroke-opacity:.3;
          filter:none;
        }

      }


      /* =========================================================
         ICON GLOW
         ========================================================= */

      @keyframes iconHighlight{

        0%{
          filter:none;
          transform:scale(1);
        }

        3%{
          filter:
            drop-shadow(0 0 2px #ff6b35)
            drop-shadow(0 0 5px #ffb03b);

          transform:scale(1);
        }

        7%{
          filter:
            drop-shadow(0 0 3px #ff6b35)
            drop-shadow(0 0 8px #ffb03b);

          transform:scale(1.08);
        }

        12%{
          filter:none;
          transform:scale(1);
        }

        100%{
          filter:none;
          transform:scale(1);
        }

      }


      /* =========================================================
         CARD
         ========================================================= */

      .cell{
        opacity:0;
        animation:
          popIn .5s cubic-bezier(.2,.8,.3,1.3) forwards;

        transform-box:fill-box;
        transform-origin:center;
      }


      /* =========================================================
         CARD BORDER ANIMATION
         ========================================================= */

      .card-border{
        animation-name:cardHighlight;
        animation-duration:12.6s;
        animation-timing-function:linear;
        animation-iteration-count:infinite;
      }


      /* =========================================================
         TROPHY ICON ANIMATION
         ========================================================= */

      .badge{
        transform-box:fill-box;
        transform-origin:center;

        animation-name:iconHighlight;
        animation-duration:12.6s;
        animation-timing-function:linear;
        animation-iteration-count:infinite;
      }

    ]]></style>

  </defs>


  <!-- =========================================================
       1. REPOSITORIES
       ========================================================= -->

