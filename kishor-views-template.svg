<svg width="310" height="90" viewBox="0 0 310 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Badge Card Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>

    <!-- Eye Glow Filter -->
    <filter id="almondGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>

    <!-- Gold Eyelid Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Blue Iris Radial Gradient -->
    <radialGradient id="almondIris" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <!-- Dark Pupil Radial Gradient -->
    <radialGradient id="darkPupil" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <style>
    .almond-blink { transform-origin: 42px 45px; animation: almondBlinkAnim 4.2s ease-in-out infinite; }
    .almond-iris-move { transform-origin: 42px 45px; animation: irisTrack 6s ease-in-out infinite; }
    .almond-glint { animation: glintPulse 2.8s ease-in-out infinite alternate; }

    @keyframes almondBlinkAnim { 
      0%, 90%, 100% { transform: scaleY(1); } 
      95% { transform: scaleY(0.06); } 
    }
    @keyframes irisTrack { 
      0%, 100% { transform: translate(0px, 0px); } 
      25% { transform: translate(-2.5px, -1.2px); } 
      50% { transform: translate(2.5px, 1.2px); } 
      75% { transform: translate(0px, 1.8px); } 
    }
    @keyframes glintPulse { 
      0% { opacity: 0.95; } 
      100% { opacity: 0.7; } 
    }
  </style>

  <!-- 1. Light Blue Outer Card Container -->
  <rect x="2" y="2" width="306" height="86" rx="16" fill="#edf7ff" stroke="#c0e0ff" stroke-width="2" filter="url(#badgeShadow)"/>

  <!-- 2. Option 2 Animated Almond Eye Logo -->
  <g filter="url(#almondGlow)">
    <g class="almond-blink">
      <!-- Almond Contour Sclera -->
      <path d="M 16 45 Q 42 27 68 45 Q 42 63 16 45 Z" fill="#ffffff" stroke="url(#goldBorder)" stroke-width="2.8" stroke-linejoin="round"/>

      <!-- Animated Blue Iris + Scanning Pupil Group -->
      <g class="almond-iris-move">
        <circle cx="42" cy="45" r="12" fill="url(#almondIris)" stroke="#1d4ed8" stroke-width="1"/>
        <circle cx="42" cy="45" r="6" fill="url(#darkPupil)"/>
        <circle cx="38" cy="41" r="2.4" fill="#ffffff" class="almond-glint"/>
      </g>
    </g>
  </g>

  <!-- 3. PROFILE VIEWS Header Text -->
  <text x="88" y="37" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#1e293b" letter-spacing="1.5">PROFILE VIEWS</text>

  <!-- 4. Dynamic View Count Number -->
  <!-- Note: Replace "199" with {{count}} or __COUNT__ if your generator script uses template placeholders -->
  <text x="88" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ff3b30">199</text>

  <!-- 5. Coral Red Accent Underline Bar -->
  <rect x="88" y="76" width="48" height="3.5" rx="1.75" fill="#ff5d42"/>
</svg>
