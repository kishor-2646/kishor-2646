<svg width="300" height="86" viewBox="0 0 300 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#DBEEFC"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="298" height="84" rx="16" fill="url(#bg)" stroke="#1E88C7" stroke-width="1.5"/>

  <!-- eye icon -->
  <g transform="translate(24,28)">
    <circle cx="15" cy="15" r="16" fill="#FFFFFF" stroke="#1E88C7" stroke-width="1.5"/>
    <path d="M2 15 C 6 6, 24 6, 28 15 C 24 24, 6 24, 2 15 Z" fill="none" stroke="#FF3B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="15" r="5.5" fill="#FF3B3B">
      <animate attributeName="r" values="5.5;6.5;5.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="13" cy="13" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- label -->
  <text x="70" y="34" font-family="Verdana, Geneva, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#0E2233">PROFILE VIEWS</text>

  <!-- count -->
  <text x="70" y="62" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="bold" fill="#FF3B3B">199</text>

  <!-- accent bar -->
  <rect x="70" y="70" width="34" height="3" rx="1.5" fill="#FF6B35"/>
</svg>
