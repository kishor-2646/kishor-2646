<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 86" width="300" height="86" role="img" aria-label="Kishor Kumar profile views">
<title>Profile Views</title>
<defs>
<style type="text/css"><![CDATA[
@keyframes glintMove{0%{transform:translateX(-110px)}100%{transform:translateX(410px)}}
.glint{animation:glintMove 3.6s ease-in-out infinite}
@keyframes lidDrop{0%,88%,100%{transform:scaleY(0)}92%{transform:scaleY(1)}}
.lid{animation:lidDrop 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
@keyframes pulse{0%,100%{r:5}50%{r:5.8}}
.pupil{animation:pulse 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.75}}
.glow{animation:glow 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="viewsGlint" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity=".45"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="irisGrad" cx="35%" cy="35%" r="70%">
  <stop offset="0%" stop-color="#5fb3f0"/>
  <stop offset="55%" stop-color="#1e88c7"/>
  <stop offset="100%" stop-color="#0e2233"/>
</radialGradient>
<radialGradient id="pupilGrad" cx="35%" cy="30%" r="75%">
  <stop offset="0%" stop-color="#ff7a5c"/>
  <stop offset="100%" stop-color="#ff3b3b"/>
</radialGradient>
<filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3.2"/>
</filter>
<clipPath id="viewsClip"><rect x="1" y="1" width="298" height="84" rx="14"/></clipPath>
<clipPath id="scleraClip"><circle cx="0" cy="0" r="15.4"/></clipPath>
</defs>

<rect x="1" y="1" width="298" height="84" rx="14" fill="#eaf6ff" stroke="#1e88c7" stroke-width="1" stroke-opacity=".5"/>

<g clip-path="url(#viewsClip)">
  <rect class="glint" x="0" y="0" width="70" height="86" fill="url(#viewsGlint)" transform="translate(-110,0) skewX(-18)"/>
</g>

<!-- eye icon: positioning lives on this static outer group -->
<g transform="translate(39,43)">
  <circle class="glow" cx="0" cy="0" r="17" fill="#ff3b3b" opacity=".35" filter="url(#softGlow)"/>
  <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#1e88c7" stroke-width="1.5"/>

  <g clip-path="url(#scleraClip)">
    <circle class="pupil" cx="0" cy="0" r="5" fill="url(#pupilGrad)"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="url(#irisGrad)" stroke-width="4.5" opacity=".55"/>
    <circle cx="-2.4" cy="-2.6" r="1.7" fill="#ffffff" opacity=".9"/>

    <!-- blinking eyelid: no transform attribute of its own, so the CSS animation below is safe -->
    <rect class="lid" x="-17" y="-16" width="34" height="32" fill="#ffffff"/>
  </g>

  <!-- lashes -->
  <path d="M-11 -11 L-14 -15 M-4 -14.5 L-5 -19 M4 -14.5 L5 -19 M11 -11 L14 -15" stroke="#0e2233" stroke-width="1.3" stroke-linecap="round"/>
</g>

<text x="70" y="36" font-family="Verdana, Geneva, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#0e2233">PROFILE VIEWS</text>
<text x="70" y="64" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="bold" fill="#ff3b3b">199</text>
<rect x="70" y="72" width="34" height="3" rx="1.5" fill="#ff6b35"/>
</svg>
